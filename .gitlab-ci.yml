# GitLab CI/CD Pipeline for Production ML Bot Detection Stack
# Stages: lint -> test -> build

stages:
  - lint
  - test
  - build

variables:
  PYTHON_VERSION: "3.13"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/pip
    - .cache/uv
    - .venv/

# 1. Этап статического анализа, проверки типов и мертвого кода
lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen || uv sync
  script:
    - echo "=== Running Quality Gates (CI Lint & Security) ==="
    - uv run just ci-lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# 2. Этап автоматизированного тестирования (Pytest)
test:
  stage: test
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgomp1 curl && rm -rf /var/lib/apt/lists/*
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen || uv sync
  script:
    - echo "=== Running Pytest Unit & Integration Suite ==="
    - uv run just ci-test
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


# 3. Этап валидации конфигурации Docker и сборки образов
build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - apk add --no-cache docker-cli-compose
  script:
    - echo "=== Validating Docker Compose Orchestration ==="
    - cp -n .env.example .env || true
    - docker compose config -q
    - echo "=== Building API Gateway Production Image ==="
    - docker build -t bot-detection-api:ci -f Dockerfile .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
