# GitHub Actions CI/CD Pipeline for Production ML Bot Detection Stack
# Jobs: lint -> test -> build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run quality & security gates
        run: uv run just ci-lint

  test:
    name: Unit, Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1 curl

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run non-live pytest suite
        run: uv run just ci-test

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: ignore

  build:
    name: Docker Compose & Image Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose orchestration
        run: |
          cp -n .env.example .env || true
          docker compose config -q

      - name: Build production image
        run: docker build -t bot-detection-api:ci -f Dockerfile .
