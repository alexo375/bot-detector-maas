global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1. FastAPI MaaS Gateway
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: "bot-detector-gateway"
          env: "production"

  # 2. NVIDIA Triton Inference Server
  - job_name: "triton-inference-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["triton:8002"]
        labels:
          service: "triton-server"
          env: "production"

  # 3. Async Inference Worker (feature extraction + Triton batch inference latency)
  - job_name: "inference-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inference-worker:8003"]
        labels:
          service: "bot-detector-inference-worker"
          env: "production"

  # 4. Prometheus Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
