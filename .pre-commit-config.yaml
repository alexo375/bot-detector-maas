# Pre-commit configuration for production bot detection stack
repos:
  - repo: local
    hooks:
      - id: just-check-static
        name: just check-static (lint, format, mypy, vulture, lengths, oop, arch)
        entry: uv --directory project run just check-static
        language: system
        pass_filenames: false
        files: ^project/(src|tests|scripts)/
      - id: security-audit
        name: bandit security audit
        entry: uv --directory project run poe security-audit
        language: system
        pass_filenames: false
        files: ^project/src/
