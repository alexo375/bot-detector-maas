[project]
name = "project"
version = "0.1.0"
description = "Production ML project for dialogue bot detection"
readme = "README.md"
authors = [
    { name = "Alexander", email = "alexo375@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.4.0",
    "catboost>=1.2.10",
    "clickhouse-connect>=0.8.0",
    "emoji>=2.16.0",
    "fastapi>=0.115.0,<0.155.0",
    "grpcio>=1.85.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=2.15.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxscript>=0.1.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.1",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "prefect>=3.0.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "skl2onnx>=1.20.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "tritonclient[http,grpc]>=2.74.0",
    "uvicorn>=0.30.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "locust>=2.47.0",
    "mypy>=2.4.1",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "rust-just>=1.36.0",
    "scipy-stubs>=1.18.1.1",
    "types-seaborn>=0.13.2.20261107",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear (catches ABC/abstractmethod and logic bugs)
    "UP",      # pyupgrade (modern Python 3.13)
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "ARG",     # flake8-unused-arguments
    "ERA",     # eradicate (dead commented code)
    "PLE",     # pylint errors
    "PLR0206", # pylint property with parameters
    "PLR0402", # use 'from x import y' in imports
    "PLW",     # pylint warnings
    "D",       # pydocstyle (docstrings)
    "T20",     # flake8-print (disallow leftover print statements in production code)
    "RUF",     # ruff-specific rules (asyncio dangling tasks, etc.)
    "BLE",     # flake8-blind-except (disallow blind except Exception without handling)
    "S",       # flake8-bandit (security analysis)
    "ASYNC",   # flake8-async (asyncio correctness)
    "C4",      # flake8-comprehensions
    "PERF",    # perflint (performance pitfalls)
    "FAST",    # fastapi specific checks
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PIE",     # flake8-pie
    "C901",    # mccabe cyclomatic complexity
    "PLR0912", # pylint too many branches
    "PLR0915", # pylint too many statements
    "TRY",     # tryceratops (exception handling best practices)
    "PTH",     # flake8-use-pathlib
    "TID",     # flake8-tidy-imports
    "DTZ",     # flake8-datetimez (timezone-aware datetimes)
    "TC",      # flake8-type-checking
    "RSE",     # flake8-raise
    "ISC",     # flake8-implicit-str-concat
    "ICN",     # flake8-import-conventions
    "PT",      # flake8-pytest-style
    "Q",       # flake8-quotes
    "PLR0911", # pylint too many return statements
]
ignore = [
    "E501",    # line length handled by formatter
    "D100",    # ignore missing docstring in public module (no forced header comment)
    "D104",    # ignore missing docstring in public package (__init__.py)
    "D105",    # ignore missing docstring in magic methods (__str__, __len__, etc.)
    "D107",    # ignore missing docstring in __init__ (class docstring is enough)
    "D205",    # 1 blank line between summary and description
    "D400",    # first line should end with a period
    "D401",    # first line should be in imperative mood
    "D415",    # first line punctuation
    "ARG002",  # unused method arguments in interface implementations (e.g. BaseFeatureView)
    "RUF001",  # ambiguous unicode in string (Cyrillic characters in Russian dialogue bot)
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
    "TRY002",  # create your own exception
    "TRY003",  # avoid specifying long messages outside the exception class
    "TRY300",  # consider moving return statement to else block
    "TRY301",  # abstract raise to an inner function
    "TRY400",  # use logging.exception instead of logging.error
    "PTH123",  # open() instead of Path.open()
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401", "D", "T201", "S101", "PERF", "RUF", "BLE", "C4", "FAST", "LOG", "G", "S311", "C901", "PLR0912", "PLR0915", "PLR0911", "DTZ", "TC", "PT"]
"tests/**" = ["D", "ARG001", "ARG002", "PLW0603", "S101", "S102", "S108", "S310", "S311", "S608", "BLE001", "PERF", "RUF043", "C901", "PLR0912", "PLR0915", "PLR0911"]
"scripts/**" = ["T201", "D", "BLE001", "S310", "C901", "PLR0912", "PLR0915", "PLR0911"]  # cli maintenance scripts may print to stdout, fetch urls and handle broad exceptions
".vulture_whitelist.py" = ["ALL"]  # vulture whitelist uses bare expressions and dummy assignments

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-returns = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-n 8 --dist loadscope"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "xdist_group: группировка тестов для последовательного выполнения в одном xdist-воркере",
    "live: интеграционные/e2e тесты, требующие поднятый стек docker compose",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:clickhouse_connect.*",
    "ignore::FutureWarning:lightgbm.*",
    "ignore::sqlalchemy.exc.SADeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
strict_equality = true
disallow_subclassing_any = false
disallow_untyped_decorators = true
ignore_missing_imports = false
disable_error_code = ["import-untyped"]
exclude = [
    "^notebooks/.*",
    "^data/.*",
    "^deploy/.*",
    "^\\.venv/.*",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "lightgbm.*",
    "onnxmltools.*",
    "onnxruntime.*",
    "shap.*",
    "skl2onnx.*",
    "sklearn.*",
    "tritonclient.*",
    "emoji.*",
    "clickhouse_connect.*",
    "optuna.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true

[tool.poe.tasks]
lint              = "ruff check ."
lint-fix          = "ruff check . --fix"
format            = "ruff format ."
format-check      = "ruff format . --check"
typecheck         = "mypy src tests"
test              = "pytest"
test-unit         = "pytest tests/unit"
test-integration  = "pytest tests/integration"
test-e2e          = "pytest tests/e2e"
test-cov          = "pytest --cov=src --cov-report=term-missing --cov-fail-under=65"
dead-code         = "vulture src tests scripts .vulture_whitelist.py"
check-lengths     = "python3 scripts/check_file_lengths.py src"
oop-check         = "python3 scripts/check_oop_style.py src"
arch-check        = "lint-imports"
audit             = { shell = "uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements.txt | pip-audit -r /dev/stdin" }
security-audit    = "bandit -r src -c pyproject.toml"
pre-commit        = "pre-commit run --all-files"

[tool.bandit]
exclude_dirs = ["tests", "data", "deploy", "notebooks", ".venv"]
skips = ["B608", "B615", "B310"]





